<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470"
     font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>

  <!-- presentation tier -->
  <rect x="20" y="20" width="720" height="92" rx="10" fill="#eef5fa" stroke="#bcd9ea"/>
  <text x="36" y="44" font-size="12" font-weight="700" fill="#0072B2"
        letter-spacing="0.08em">PRESENTATION — browser</text>
  <g font-size="11.5" fill="#16202b">
    <rect x="36" y="56" width="126" height="40" rx="6" fill="#fff" stroke="#cfe0ec"/>
    <text x="48" y="73">map.js</text><text x="48" y="88" font-size="10" fill="#5b6b7c">Leaflet, routes</text>
    <rect x="174" y="56" width="126" height="40" rx="6" fill="#fff" stroke="#cfe0ec"/>
    <text x="186" y="73">controls.js</text><text x="186" y="88" font-size="10" fill="#5b6b7c">weights, wind</text>
    <rect x="312" y="56" width="126" height="40" rx="6" fill="#fff" stroke="#cfe0ec"/>
    <text x="324" y="73">results.js</text><text x="324" y="88" font-size="10" fill="#5b6b7c">plan, fleet</text>
    <rect x="450" y="56" width="126" height="40" rx="6" fill="#fff" stroke="#cfe0ec"/>
    <text x="462" y="73">animation.js</text><text x="462" y="88" font-size="10" fill="#5b6b7c">playback</text>
    <rect x="588" y="56" width="116" height="40" rx="6" fill="#fff" stroke="#cfe0ec"/>
    <text x="600" y="73">charts.js</text><text x="600" y="88" font-size="10" fill="#5b6b7c">benchmarks</text>
  </g>

  <path d="M380 112 L380 138" stroke="#9aa8b5" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="392" y="130" font-size="10.5" fill="#5b6b7c">HTTP / JSON on localhost</text>

  <!-- application tier -->
  <rect x="20" y="144" width="720" height="78" rx="10" fill="#f6f2fa" stroke="#d9cfe6"/>
  <text x="36" y="168" font-size="12" font-weight="700" fill="#7a5aa8"
        letter-spacing="0.08em">APPLICATION — Flask</text>
  <g font-size="11.5" fill="#16202b">
    <rect x="36" y="180" width="200" height="30" rx="6" fill="#fff" stroke="#e0d6ea"/>
    <text x="48" y="200">api.py — endpoints, validation</text>
    <rect x="248" y="180" width="216" height="30" rx="6" fill="#fff" stroke="#e0d6ea"/>
    <text x="260" y="200">orchestrator.py — planning cycle</text>
    <rect x="476" y="180" width="228" height="30" rx="6" fill="#fff" stroke="#e0d6ea"/>
    <text x="488" y="200">cache.py — all-pairs route table</text>
  </g>

  <path d="M380 222 L380 248" stroke="#9aa8b5" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="392" y="240" font-size="10.5" fill="#5b6b7c">in-process calls</text>

  <!-- algorithm tier -->
  <rect x="20" y="254" width="720" height="152" rx="10" fill="#eef7f2" stroke="#bfe0d0"/>
  <text x="36" y="278" font-size="12" font-weight="700" fill="#009E73"
        letter-spacing="0.08em">ALGORITHM — pure Python, no framework imports</text>
  <g font-size="11.5" fill="#16202b">
    <rect x="36" y="290" width="160" height="50" rx="6" fill="#fff" stroke="#cfe7da"/>
    <text x="48" y="308">graph/</text>
    <text x="48" y="325" font-size="10" fill="#5b6b7c">adjacency list, validation</text>
    <rect x="208" y="290" width="160" height="50" rx="6" fill="#fff" stroke="#cfe7da"/>
    <text x="220" y="308">algorithms/</text>
    <text x="220" y="325" font-size="10" fill="#5b6b7c">Dijkstra, A*, constrained</text>
    <rect x="380" y="290" width="160" height="50" rx="6" fill="#fff" stroke="#cfe7da"/>
    <text x="392" y="308">scheduling/</text>
    <text x="392" y="325" font-size="10" fill="#5b6b7c">queue, tours, fleet size</text>
    <rect x="552" y="290" width="152" height="50" rx="6" fill="#fff" stroke="#cfe7da"/>
    <text x="564" y="308">cost/ + environment/</text>
    <text x="564" y="325" font-size="10" fill="#5b6b7c">weights, wind, no-fly</text>

    <rect x="36" y="350" width="160" height="44" rx="6" fill="#fff" stroke="#cfe7da"/>
    <text x="48" y="368">structures/</text>
    <text x="48" y="384" font-size="10" fill="#5b6b7c">hand-written min-heap</text>
    <rect x="208" y="350" width="160" height="44" rx="6" fill="#fff" stroke="#cfe7da"/>
    <text x="220" y="368">analysis/</text>
    <text x="220" y="384" font-size="10" fill="#5b6b7c">instrumentation, benchmarks</text>
    <rect x="380" y="350" width="324" height="44" rx="6" fill="#fbfdfc" stroke="#cfe7da"
          stroke-dasharray="4 3"/>
    <text x="392" y="368" font-size="11" fill="#009E73">No import of Flask reaches this tier.</text>
    <text x="392" y="384" font-size="10" fill="#5b6b7c">Enforced by test_layering.py, not by convention.</text>
  </g>

  <!-- data -->
  <rect x="20" y="418" width="720" height="34" rx="8" fill="#f4f6f8" stroke="#d8e0e8"/>
  <text x="36" y="440" font-size="11.5" fill="#5b6b7c">
    data/ — city_map · city_backdrop · fleet · deliveries · presets · no_fly_zones</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa8b5"/></marker>
  </defs>
</svg>
